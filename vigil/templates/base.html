<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Vigil{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-gray-900 text-white px-6 py-3 flex items-center gap-6 shadow">
    <a href="/" class="font-bold text-lg tracking-tight">⚡ Vigil</a>
    <a href="/" class="text-gray-300 hover:text-white text-sm">インシデント</a>
    <a href="/schedules" class="text-gray-300 hover:text-white text-sm">オンコール</a>
    <a href="/users" class="text-gray-300 hover:text-white text-sm">ユーザー</a>
    <div class="ml-auto">
      <a href="/incidents/new"
         class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded text-sm font-semibold transition-colors">
        + 新規インシデント
      </a>
    </div>
  </nav>
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
